# Controllo dei PR verso main: il titolo deve essere in Conventional Commits.
# Il merge non rilascia nulla (la release si lancia a mano, vedi release-manual.yml e
# docs/RELEASE.md). Con lo squash merge però il titolo diventa il subject del commit su main,
# ed è quello che il calcolo della release leggerà.
name: Titolo PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test degli script di release
        run: node --test scripts/release-version.test.mjs

      # Il titolo arriva da env e non dal testo del workflow: un titolo con virgolette o
      # `$(…)` non può eseguire comandi.
      - name: Controllo del titolo
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          kind=$(node scripts/release-version.mjs check-title --title "$TITLE")
          {
            echo "Titolo riconosciuto: \`$TITLE\`"
            echo
            echo "- tipo → peso in una release: $kind"
            echo "- **Il merge non rilascia nulla**: la release si lancia a mano (docs/RELEASE.md)."
          } >> "$GITHUB_STEP_SUMMARY"
