# Release: builda l'AppImage Linux e l'installer Windows (NSIS) e li pubblica in una
# GitHub Release. Nessuna firma del codice.
#
# Parte in tre modi:
#   - richiamato da release-manual.yml, con l'input `tag` appena creato: è il percorso normale;
#   - al push di un tag `v*` fatto a mano da un admin (release di emergenza, docs/RELEASE.md);
#   - a mano da GitHub (Actions › Release › Run workflow): costruisce gli artefatti e non
#     pubblica la Release, anche se il lancio parte da un ref di tipo tag.
#
# Il checkout usa sempre il tag, mai il commit di partenza: quando è richiamato, il
# `github.sha` del chiamante è il commit di main prima del commit di release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Tag di versione da compilare e pubblicare (es. v26.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  # Tag da rilasciare: l'input quando il workflow è richiamato (lì `github` è il contesto del
  # chiamante, non il tag), altrimenti il tag pushato. Vuoto nei lanci manuali su un branch.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  # Prima di costruire: un tag che non coincide con la versione dei manifest produrrebbe
  # artefatti e Release con un numero sbagliato, e un tag su un commit fuori da main
  # pubblicherebbe codice non revisionato. Nei lanci manuali su branch i controlli sul tag sono saltati.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          # fetch-depth 0: il controllo sul tag deve vedere la storia di main, non solo il commit.
          fetch-depth: 0

      - name: Il tag deve puntare a un commit già unito in main
        if: env.RELEASE_TAG != ''
        run: |
          tag_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Il tag deve puntare a un commit già unito in main: $RELEASE_TAG punta a $tag_commit, che non è in main."
            exit 1
          fi
          echo "Il commit del tag è contenuto in main."

      - uses: ./.github/actions/setup

      - name: Versione del tag e dei manifest
        if: env.RELEASE_TAG != ''
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: '--linux AppImage --x64'
          - os: windows-latest
            package: '--win nsis --x64'
    runs-on: ${{ matrix.os }}
    env:
      # Niente firma: electron-builder non cerca certificati nel runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup

      - name: Build (typecheck e bundle electron-vite)
        run: pnpm build

      - name: Pacchettizzazione electron-builder
        run: pnpm --filter @webeep/desktop exec electron-builder ${{ matrix.package }} --publish never

      # Solo Linux. electron-builder non incorpora le update information nell'AppImage e non
      # genera il .zsync: lo fa lo script, reimpacchettando l'AppImage con appimagetool e
      # riscrivendo latest-linux.yml (sha512 e size cambiano). Lo strumento è fissato a una
      # versione con checksum verificato, così un rilascio di appimagetool non cambia la build.
      # zsyncmake è incluso nell'appimagetool stesso, nessun pacchetto apt da installare.
      - name: Update information e zsync per l'AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/bin/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/bin/appimagetool" bash apps/desktop/scripts/appimage-zsync.sh apps/desktop/release

      # Il .exe.blockmap serve a electron-updater (Windows) per i download differenziali.
      # Il .AppImage.zsync serve ai manager zsync (AppImageUpdate, Gear Lever, AppImageLauncher).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.zsync
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  # Unico job con permesso di scrittura: serve solo a creare la Release. Parte solo quando è
  # richiamato con un tag o dal push di un tag `v*`: un workflow_dispatch, anche da un ref di
  # tipo tag, builda e basta.
  release:
    needs: build
    if: inputs.tag != '' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      # Il sito della Release deve ospitare anche .zsync e .blockmap: senza, gli aggiornamenti
      # zsync (Linux) e differenziali (Windows) non trovano i file e ricadono sul download completo.
      # tag_name e name sono espliciti: quando il workflow è richiamato, il ref è quello di main.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WeBeep Desktop ${{ env.RELEASE_TAG }}
          files: |
            release-assets/*.AppImage
            release-assets/*.AppImage.zsync
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/latest*.yml
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
