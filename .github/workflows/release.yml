# Release automatica: al push di un tag di versione `v*` builda l'AppImage Linux e
# l'installer Windows (NSIS) e li pubblica in una GitHub Release. Nessuna firma del codice.
# Il dispatch manuale costruisce solo gli artefatti (utile per provare): non crea la Release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Prima di costruire: un tag `v*` che non coincide con la versione del package produrrebbe
  # artefatti e Release con un numero sbagliato, e un tag su un commit fuori da main
  # pubblicherebbe codice non revisionato. Su dispatch manuale i controlli sono saltati.
  version-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: il controllo sul tag deve vedere la storia di main, non solo il commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Il tag deve puntare a un commit già unito in main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::Il tag deve puntare a un commit già unito in main: $REF_NAME punta a $COMMIT_SHA, che non è in main."
            exit 1
          fi
          echo "Il commit del tag è contenuto in main."

      - name: Versione del tag e del package
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "Nessun tag di versione ($REF): controllo della versione saltato."
            exit 0
          fi
          TAG_VERSION="${REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Il tag $REF_NAME non corrisponde alla versione di apps/desktop/package.json ($PACKAGE_VERSION). Allinea la versione prima di taggare."
            exit 1
          fi
          echo "Versione verificata: $PACKAGE_VERSION"

  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: '--linux AppImage --x64'
          - os: windows-latest
            package: '--win nsis --x64'
    runs-on: ${{ matrix.os }}
    env:
      # Niente firma: electron-builder non cerca certificati nel runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm va installato prima di setup-node, altrimenti la cache pnpm non trova il binario.
      # Senza `version` legge il campo `packageManager` del package.json root.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (typecheck e bundle electron-vite)
        run: pnpm build

      - name: Pacchettizzazione electron-builder
        run: pnpm --filter @webeep/desktop exec electron-builder ${{ matrix.package }} --publish never

      # Solo Linux. electron-builder non incorpora le update information nell'AppImage e non
      # genera il .zsync: lo fa lo script, reimpacchettando l'AppImage con appimagetool e
      # riscrivendo latest-linux.yml (sha512 e size cambiano). Lo strumento è fissato a una
      # versione con checksum verificato, così un rilascio di appimagetool non cambia la build.
      # zsyncmake è incluso nell'appimagetool stesso, nessun pacchetto apt da installare.
      - name: Update information e zsync per l'AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/bin/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/bin/appimagetool" bash apps/desktop/scripts/appimage-zsync.sh apps/desktop/release

      # Il .exe.blockmap serve a electron-updater (Windows) per i download differenziali.
      # Il .AppImage.zsync serve ai manager zsync (AppImageUpdate, Gear Lever, AppImageLauncher).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.zsync
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  # Unico job con permesso di scrittura: serve solo a creare la Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      # Il sito della Release deve ospitare anche .zsync e .blockmap: senza, gli aggiornamenti
      # zsync (Linux) e differenziali (Windows) non trovano i file e ricadono sul download completo.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release-assets/*.AppImage
            release-assets/*.AppImage.zsync
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/latest*.yml
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
